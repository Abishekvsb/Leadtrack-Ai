services:
  - type: web
    name: leadtrack-ai
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && (npx prisma migrate deploy || true) && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_lpXCRakiO5Z2@ep-dark-smoke-azb3wjjh-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: DIRECT_URL
        value: "postgresql://neondb_owner:npg_lpXCRakiO5Z2@ep-dark-smoke-azb3wjjh.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: "https://leadtrack-ai.onrender.com"
      - key: CRON_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "LeadTrack AI <admissions@leadtrack.ai>"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
